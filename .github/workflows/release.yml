name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm/markdown_analyzer

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm run build

      - name: Package extension
        run: |
          mv dist markcraft
          zip -qr "markcraft-${{ github.ref_name }}.zip" markcraft -x '*.DS_Store'

      - name: Create release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "markcraft-${{ github.ref_name }}.zip" \
            --title "MarkCraft ${{ github.ref_name }}" \
            --notes "Download \`markcraft-${{ github.ref_name }}.zip\`, unzip it, then open \`chrome://extensions\`, enable Developer mode, click **Load unpacked**, and select the unzipped \`markcraft\` folder."
